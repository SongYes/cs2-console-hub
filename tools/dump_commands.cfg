// ============================================================
//  CS2 全量指令导出（由 CS2 控制台指令查询中心生成）
// ------------------------------------------------------------
//  用法（任选其一）：
//   A. 在游戏内控制台执行：  exec dump_commands
//   B. 若已在启动项里加了 -condebug，执行完结果也会出现在
//      ...\Counter-Strike Global Offensive\game\csgo\console.log
//   C. 生成的文件位于 ...\game\csgo\ 目录下
//
//  生成后把这两个文件发我即可：
//      cs2_cvarlist.txt
//      cs2_cmdlist.txt
// ============================================================

echo "=== 开始导出 CS2 指令清单 ===";

// 所有控制台变量（名称、当前值、默认值、权限标记、说明）
cvarlist;

// 所有控制台指令（命令，含参数说明）
cmdlist;

// 顺带把当前生效的设置也存一份，便于核对默认值
host_writeconfig;

echo "=== 导出完成：cs2_cvarlist.txt / cs2_cmdlist.txt ===";
